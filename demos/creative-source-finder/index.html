<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按用途筛选字体、图标、摄影与插画来源，比较许可条件，保存并导出创作清单。"><title>创作素材导航</title><link rel="stylesheet" href="styles.css"></head><body>
<a class="skip" href="#results">跳到素材</a>
<header><a class="brand" href="./" aria-label="创作素材导航首页"><span class="brandmark" aria-hidden="true"></span><strong>创作素材导航</strong></a><button id="saved-toggle" class="quiet" aria-haspopup="dialog">我的清单 <span id="saved-count">0</span></button></header>
<main><section class="search-area" aria-labelledby="page-title"><div class="title-row"><h1 id="page-title">按用途找素材</h1><span class="edition">12 个来源 · 2026.10.26 核对</span></div><form id="search-form" role="search"><label for="search" class="sr-only">搜索素材来源</label><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="试试：中文字体、线性图标、手绘…" autocomplete="off" maxlength="200"><button type="button" id="reset-query" class="quiet" aria-label="清空搜索" hidden>清空</button></form><nav id="categories" aria-label="素材用途"></nav></section>
<section class="workspace" aria-label="素材筛选与结果"><div class="filterbar"><div class="selects"><label>格式 <select id="format"><option value="all">全部格式</option></select></label><label>许可 <select id="license"><option value="all">不限类型</option><option value="open">开源许可</option><option value="custom">站点专用许可</option><option value="mixed">逐项查看许可</option></select></label></div><div class="result-actions"><span id="result-count" role="status" aria-live="polite"></span><button id="share" class="quiet">分享筛选</button></div></div><div id="chips" class="chips"></div><div id="results" class="grid" tabindex="-1"></div><div id="empty" hidden><span class="empty-mark" aria-hidden="true">∅</span><h2>没有符合条件的来源</h2><p id="empty-tip"></p><button id="empty-reset">清除筛选</button></div></section>

</main><aside id="compare-bar" class="compare-bar" hidden aria-label="对比栏"><div><strong id="compare-count"></strong><span id="compare-names"></span></div><button id="clear-compare" class="quiet">清空</button><button id="open-compare" class="primary">并排对比</button></aside>
<dialog id="compare-dialog" aria-labelledby="compare-title"><div class="dialog-head"><h2 id="compare-title">比较后再选</h2><button id="close-compare" class="quiet">关闭</button></div><div id="compare-content"></div></dialog>
<dialog id="saved-dialog" aria-labelledby="saved-title"><div class="dialog-head"><h2 id="saved-title">我的素材清单</h2><button id="close-saved" class="quiet">关闭</button></div><div id="saved-content"></div><div class="dialog-foot"><div><button id="view-saved" class="quiet">只看收藏</button><button id="export" class="primary">导出 Markdown</button></div></div></dialog>
<dialog id="share-dialog" aria-labelledby="share-title"><div class="dialog-head"><h2 id="share-title">分享当前筛选</h2><button id="close-share" class="quiet">关闭</button></div><label for="share-link" class="small">链接包含搜索词、筛选与对比项，不包含收藏。</label><textarea id="share-link" readonly rows="3" aria-label="筛选链接"></textarea><div class="dialog-foot"><span id="share-status" class="small" role="status">也可选中链接手动复制。</span><button id="copy-link" class="primary">复制链接</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
