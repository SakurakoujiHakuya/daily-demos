<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="调整图片大小、格式和画质，比较输出结果并下载。"><title>图片轻装</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span aria-hidden="true">◩</span> 图片轻装</a></header>
<main><div class="heading"><div><h1>缩小图片，直接下载</h1></div><div id="top-actions" class="top-actions" hidden><button id="sample" class="quiet">试用示例</button><button id="choose" class="secondary">选择图片</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif,image/bmp" hidden></div></div>
<section id="drop" class="drop"><div class="drop-inner"><div class="drop-icon" aria-hidden="true">↧</div><h2>把图片拖到这里</h2><button id="start" class="primary">选择图片</button><button id="sample-empty" class="text-button">先用示例试试 →</button><small>最大 25 MB / 2400 万像素</small></div></section>
<section id="workspace" hidden aria-label="图片处理工作区"><div class="workspace-grid"><div class="previews"><figure><figcaption><strong>原图</strong><span id="original-meta"></span></figcaption><div class="image-box"><img id="original" alt="原始图片预览"></div></figure><figure class="result-figure"><figcaption><strong>处理后</strong><span id="result-meta"></span></figcaption><div class="image-box"><img id="result" alt="处理后的图片预览"></div></figure></div><aside class="controls"><div class="file-row"><span id="filename"></span><button id="replace" class="text-button">更换</button></div><label for="width">输出宽度 <span>等比例</span></label><div class="number-row"><input id="width" type="number" min="1" max="8192" inputmode="numeric"><span>px</span></div><div class="presets" aria-label="宽度预设"><button data-width="640">640</button><button data-width="1280">1280</button><button data-width="1920">1920</button><button data-width="original">最大尺寸</button></div><label for="format">输出格式</label><select id="format"><option value="image/webp">WebP · 更小体积</option><option value="image/jpeg">JPEG · 通用照片</option><option value="image/png">PNG · 无损透明</option></select><div id="quality-control"><label for="quality">画质 <output id="quality-value">80%</output></label><input id="quality" type="range" min="10" max="100" value="80"><div class="range-labels"><span>更小</span><span>更清晰</span></div></div><div class="summary"><div><span>输出文件</span><strong id="size">—</strong></div><span id="saving" class="saving">—</span></div><a id="download" class="primary download" aria-disabled="true">下载图片 ↓</a><button id="reset" class="text-button reset">重置设置</button><details><summary>格式说明</summary><p>透明图片转 JPEG 会填充白底。GIF 仅保留一帧；导出不保留原始元数据或动画。尺寸变化、浏览器编码会影响画质与色彩。</p><p>WebP 不受支持时会明确提示实际格式。PNG 无画质调节，转换后可能更大。</p></details></aside></div><p id="notice" class="notice" role="status" aria-live="polite"></p></section>
<p id="error" class="error" role="alert" hidden></p></main><script type="module" src="app.js"></script></body></html>
