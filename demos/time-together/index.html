<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在不同时区找到共同空闲时间，按日期处理夏令时，导出日历。"><title>一起几点 · 跨时区约时间</title><link rel="stylesheet" href="style.css"></head><body><main><header><a class="brand" href="./"><span class="mark">◷</span><strong>一起几点</strong></a></header><section class="toolbar" aria-label="规划设置"><label>日期<input id="date" type="date" min="2020-01-01" max="2040-12-31"></label><label>按谁的一天<select id="reference"></select></label><label>约多久<select id="duration"><option value="30">30 分钟</option><option value="60" selected>1 小时</option><option value="90">1.5 小时</option><option value="120">2 小时</option></select></label><button id="today" class="light">今天</button></section><p id="error" role="alert" hidden></p><section class="result" aria-label="选中的时间"><div class="result-top"><div><span class="eyebrow" id="status">共同空闲</span><h1 id="selectedTime">—</h1><p id="selectedDate"></p></div><button id="download" class="primary">下载日历 .ics <span aria-hidden="true">↗</span></button></div><div id="selectedCities" class="selected-cities"></div></section><section class="suggestions" aria-label="可用时段"><strong id="suggestionLabel">可选开始时间</strong><div id="choices"></div><p id="noOverlap" hidden>没有共同空闲。放宽某个城市的可用时间，或缩短时长。</p></section><section class="board" aria-labelledby="boardTitle"><div class="section-heading"><h2 id="boardTitle">大家的可用时间</h2><span class="legend"><span><i class="day-key"></i>日间</span><span><i class="night-key"></i>夜间</span><span><i class="available-key"></i>个人可用</span><span><i class="common-key"></i>共同可用</span><span><i class="selected-key"></i>已选</span></span></div><div id="people"></div><div class="add-row"><select id="addZone" aria-label="添加城市"></select><button id="add" class="light">＋ 添加城市</button><span id="dayInfo" class="quiet"></span></div></section><details><summary>时间怎么算？</summary><p>色带每格 30 分钟。日间表示当地 07:00–19:00，不代表日出日落；底边标记个人可用，橙色表示共同可用。时段按左上角参考城市的日期展示，其他城市可能是前一天或后一天。选择相同的开始与结束时间表示全天可用；结束早于开始表示跨午夜。</p><p>夏令时切换日可能有 23 或 25 小时；重复时刻会标注 UTC 偏移。未来规则可能变更，请以当地最新安排为准。</p></details><footer><button id="reset">恢复示例</button></footer><div id="toast" role="status" aria-live="polite"></div></main><script type="module" src="app.js"></script></body></html>
