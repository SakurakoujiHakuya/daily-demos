<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="本地整理文本换行、空白和列表，保留原文并实时预览。"><title>文字整理台</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><span class="mark" aria-hidden="true">Aa</span><h1>文字整理台</h1></div></header><section class="toolbar" aria-label="整理方式"><div class="presets" role="group" aria-label="任务预设"><button data-preset="gentle" aria-pressed="true">整理空白</button><button data-preset="pdf" aria-pressed="false">PDF 断行</button><button data-preset="list" aria-pressed="false">统一列表</button></div><button id="sample" class="quiet">试用示例</button></section><p id="hint" class="hint">去掉行首尾空白和多余空行，保留段落。</p><section class="workspace"><div class="panel"><div class="panel-head"><label for="source">原文</label><div><button id="undo" class="quiet" disabled>撤销输入</button><button id="clear" class="quiet" disabled>清空</button></div></div><textarea id="source" spellcheck="false" placeholder="在这里粘贴文字…" aria-describedby="inputlimit"></textarea><div class="panel-foot"><span id="source-count">0 字符 · 0 行</span><span id="inputlimit">最多 100,000 字符</span></div></div><div class="panel result-panel"><div class="panel-head"><label for="result">整理结果</label><span id="badge" class="badge">等待输入</span></div><textarea id="result" readonly spellcheck="false" ></textarea><div class="panel-foot"><span id="result-count">0 字符 · 0 行</span><span id="delta"></span></div></div></section><div class="actions"><div class="left-actions"><button id="download" class="secondary" disabled>下载 .txt</button><button id="apply" class="quiet" disabled>用结果继续整理</button></div><button id="copy" class="primary" disabled>复制结果 <span aria-hidden="true">↗</span></button></div><p id="status" role="status" aria-live="polite"></p><details class="settings"><summary>细调与变更</summary><div class="options"><label><input id="trim" type="checkbox" checked>行首尾空白</label><label><input id="blanks" type="checkbox" checked>多余空行</label><label><input id="spaces" type="checkbox">连续空格合一</label><label><input id="join" type="checkbox">合并段内断行</label><label><input id="bullets" type="checkbox">统一无序符号</label></div><p class="fine">合并断行可能误判段落，请对照原文确认。</p><pre id="diff" aria-label="逐行变更"></pre></details><footer><a href="https://github.com/SakurakoujiHakuya/daily-demos/tree/main/demos/text-tidy" target="_blank" rel="noopener">MIT · 源码</a></footer></main><script type="module" src="app.js"></script></body></html>
